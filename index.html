      </div>
      <div class="d-icon" data-app="chat" style="--ic: var(--c-magenta)">
        <div class="glyph">💬</div><div class="lbl">G26_BOT.exe</div>

      </div>

      </div>
      <div class="d-icon" data-app="github" style="--ic: var(--c-acid)">
        <div class="glyph">🔗</div><div class="lbl">GitHub.lnk</div>
      </div>
    </div>
  </div>
